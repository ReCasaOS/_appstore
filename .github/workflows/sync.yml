name: sync

# The App Store catalogue every CasaOS box fetches is not a repository any more:
# since February 2025 the default store URL is the artifact IceWhaleTech/
# CasaOS-AppStore builds on its gh-pages branch, store/main.zip, served through
# jsdelivr. This repository holds the same bytes, taken again every night, at
#
#   https://raw.githubusercontent.com/ReCasaOS/_appstore/main/store/main.zip
#
# and AppManagement in the ReCasaOS distribution fetches them when IceWhale's URL
# stops answering (service/appstore_mirror.go). Nothing is edited: the catalogue
# is IceWhale's. `main` is one commit with the zip and a README, remade when the
# zip changes; this branch holds nothing but this file.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: sync
      GIT_AUTHOR_EMAIL: sync@recasaos.invalid
      GIT_COMMITTER_NAME: sync
      GIT_COMMITTER_EMAIL: sync@recasaos.invalid
    steps:
      - uses: actions/checkout@v4
      - name: main holds the store IceWhale builds today
        run: |
          set -euo pipefail
          curl -fsSL -o main.zip https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/gh-pages/store/main.zip
          apps="$(unzip -l main.zip | awk '{print $4}' | grep -c 'Apps/[^/]*/docker-compose.yml$')"
          echo "apps in the zip: ${apps}"
          test "${apps}" -gt 100
          git fetch --quiet origin main || true
          new="$(sha256sum main.zip | cut -c1-64)"
          have="$(git cat-file -p origin/main:store/main.zip 2>/dev/null | sha256sum | cut -c1-64 || true)"
          if [ "${new}" = "${have}" ]; then
            echo "main already holds this zip"
            exit 0
          fi
          cat > README.md <<'EOF'
          # A copy of the CasaOS App Store catalogue

          `store/main.zip` is the App Store catalogue CasaOS fetches: the artifact
          [IceWhaleTech/CasaOS-AppStore](https://github.com/IceWhaleTech/CasaOS-AppStore)
          builds on its `gh-pages` branch, taken again every night, byte for byte.
          The [ReCasaOS distribution](https://github.com/ReCasaOS/CasaOS-Install) fetches
          it from here when IceWhale's URL stops answering. Nothing is edited: the
          catalogue is IceWhale's, and so are the apps in it.
          EOF
          export GIT_INDEX_FILE="$(mktemp -u)"
          git update-index --add --cacheinfo "100644,$(git hash-object -w main.zip),store/main.zip"
          git update-index --add --cacheinfo "100644,$(git hash-object -w README.md),README.md"
          tree="$(git write-tree)"
          commit="$(git commit-tree "${tree}" -m "IceWhale's store/main.zip as of $(date -u +%Y-%m-%d), ${apps} apps")"
          git push --force --quiet origin "${commit}:refs/heads/main"
          echo "main is now the zip of $(date -u +%Y-%m-%d), ${apps} apps"
